<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ZetoEngine2D Benchmark</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				background: #111;
				color: #ddd;
				font-family: Arial, sans-serif;
				overflow: hidden;
			}
			#canvas {
				position: fixed;
				inset: 0;
				width: 100vw;
				height: 100vh;
			}
			#benchmark-output {
				position: fixed;
				top: 42px;
				left: 8px;
				max-width: min(50vw, 640px);
				max-height: 90vh;
				overflow: auto;
				background: rgba(0, 0, 0, 0.65);
				padding: 10px;
				border: 1px solid #444;
				font-size: 12px;
				white-space: pre-wrap;
			}
			#benchmark-copy {
				position: fixed;
				bottom: 8px;
				left: 8px;
				background: rgba(0, 0, 0, 0.8);
				color: #ddd;
				border: 1px solid #555;
				padding: 6px 10px;
				font-size: 12px;
				cursor: pointer;
			}
			#benchmark-copy:hover {
				background: rgba(24, 24, 24, 0.95);
			}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>
		<button id="benchmark-copy" type="button">Copy output</button>
		<pre id="benchmark-output">Initializing benchmark...</pre>
		<script src="../dist/matter.js"></script>
		<script src="../dist/zeto.js"></script>
		<script type="module">
			// import { ZetoEngine } from '../src/ZetoEngine.js';
			const engine = new ZetoEngine({
				moduleName: 'main',
				smoothing: false,
				moduleRoot: '../benchmark/'
			});

			engine.showFPS = true;
		</script>
	</body>
</html>
